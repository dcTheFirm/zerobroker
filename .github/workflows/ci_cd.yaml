name: Build, Push and GitOps Update

on:
  push:
    branches:
      - CI-CD

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # Frontend
      # -------------------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Backend
      # -------------------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Backend Auth
      # -------------------------
      - name: Build and Push Backend Auth
        uses: docker/build-push-action@v6
        with:
          context: ./backend-auth
          file: ./backend-auth/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Backend Buy
      # -------------------------
      - name: Build and Push Backend Buy
        uses: docker/build-push-action@v6
        with:
          context: ./backend-buy
          file: ./backend-buy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-buy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Backend Home
      # -------------------------
      - name: Build and Push Backend Home
        uses: docker/build-push-action@v6
        with:
          context: ./backend-home
          file: ./backend-home/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-home:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Backend Rent
      # -------------------------
      - name: Build and Push Backend Rent
        uses: docker/build-push-action@v6
        with:
          context: ./backend-rent
          file: ./backend-rent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-rent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Backend Search
      # -------------------------
      - name: Build and Push Backend Search
        uses: docker/build-push-action@v6
        with:
          context: ./backend-search
          file: ./backend-search/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-search:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =====================================================
      # UPDATE KUBERNETES MANIFESTS
      # =====================================================

      - name: Update Kubernetes image tags
        run: |
          TAG="${GITHUB_SHA}"

          sed -i "s|image: dcthefirm/frontend:.*|image: dcthefirm/frontend:${TAG}|" \
            k8s/frontend/deployment.yaml

          sed -i "s|image: dcthefirm/backend-auth:.*|image: dcthefirm/backend-auth:${TAG}|" \
            k8s/backend/k8s-auth/deployment.yaml

          sed -i "s|image: dcthefirm/backend-buy:.*|image: dcthefirm/backend-buy:${TAG}|" \
            k8s/backend/k8s-buy/deployment.yaml

          sed -i "s|image: dcthefirm/backend-home:.*|image: dcthefirm/backend-home:${TAG}|" \
            k8s/backend/k8s-home/deployment.yaml

          sed -i "s|image: dcthefirm/backend-rent:.*|image: dcthefirm/backend-rent:${TAG}|" \
            k8s/backend/k8s-rent/deployment.yaml

          sed -i "s|image: dcthefirm/backend-search:.*|image: dcthefirm/backend-search:${TAG}|" \
            k8s/backend/k8s-search/deployment.yaml

          # If you also have a main backend deployment:
          if [ -f k8s/backend/deployment.yaml ]; then
            sed -i "s|image: dcthefirm/backend:.*|image: dcthefirm/backend:${TAG}|" \
              k8s/backend/deployment.yaml
          fi

      # =====================================================
      # SHOW CHANGES
      # =====================================================

      - name: Show updated manifests
        run: |
          echo "Updated image references:"
          grep -R "image:" k8s/

      # =====================================================
      # COMMIT MANIFEST CHANGES
      # =====================================================

      - name: Commit and push Kubernetes manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes."
            exit 0
          fi

          git commit -m "chore: update images to ${GITHUB_SHA}"
          git push