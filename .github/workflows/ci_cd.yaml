name: Build and Push to Docker Hub

on:
  push:
    branches:
      - CI-CD

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Main
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Auth
      - name: Build and Push Backend Auth
        uses: docker/build-push-action@v6
        with:
          context: ./backend-auth
          file: ./backend-auth/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Buy
      - name: Build and Push Backend Buy
        uses: docker/build-push-action@v6
        with:
          context: ./backend-buy
          file: ./backend-buy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-buy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Home
      - name: Build and Push Backend Home
        uses: docker/build-push-action@v6
        with:
          context: ./backend-home
          file: ./backend-home/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-home:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Rent
      - name: Build and Push Backend Rent
        uses: docker/build-push-action@v6
        with:
          context: ./backend-rent
          file: ./backend-rent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-rent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend Search
      - name: Build and Push Backend Search
        uses: docker/build-push-action@v6
        with:
          context: ./backend-search
          file: ./backend-search/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-search:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
