name: Build, Push and GitOps Update

on:
  push:
    branches:
      - master
    paths:
      - "front-end/**"
      - "backend/**"
      - "backend-auth/**"
      - "backend-buy/**"
      - "backend-home/**"
      - "backend-rent/**"
      - "backend-search/**"
      - ".github/workflows/ci_cd.yaml"
    # NOTE: the paths list above is an allow-list — only these directories
    # trigger the workflow. k8s/** is intentionally NOT in this list, so
    # commits made by the GitOps step (which only touch k8s/) never
    # re-trigger this workflow. (GitHub Actions does not allow combining
    # `paths` and `paths-ignore` on the same event, so this is enforced
    # purely by omission.)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ==========================================================
  # DETECT WHICH SERVICES CHANGED
  # ==========================================================
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'front-end/**'
              - ".github/workflows/ci_cd.yaml"
            backend:
              - 'backend/**'
            backend-auth:
              - 'backend-auth/**'
            backend-buy:
              - 'backend-buy/**'
            backend-home:
              - 'backend-home/**'
            backend-rent:
              - 'backend-rent/**'
            backend-search:
              - 'backend-search/**'

      - name: Create build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          SERVICES="[]"

          if [[ "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"frontend",
                "context":"front-end",
                "dockerfile":"front-end/Dockerfile",
                "manifest":"k8s/frontend/deployment.yaml",
                "image":"frontend"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend",
                "context":"backend",
                "dockerfile":"backend/Dockerfile",
                "manifest":"k8s/backend/deployment.yaml",
                "image":"backend"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-auth }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-auth",
                "context":"backend-auth",
                "dockerfile":"backend-auth/Dockerfile",
                "manifest":"k8s/backend/k8s-auth/deployment.yaml",
                "image":"backend-auth"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-buy }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-buy",
                "context":"backend-buy",
                "dockerfile":"backend-buy/Dockerfile",
                "manifest":"k8s/backend/k8s-buy/deployment.yaml",
                "image":"backend-buy"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-home }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-home",
                "context":"backend-home",
                "dockerfile":"backend-home/Dockerfile",
                "manifest":"k8s/backend/k8s-home/deployment.yaml",
                "image":"backend-home"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-rent }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-rent",
                "context":"backend-rent",
                "dockerfile":"backend-rent/Dockerfile",
                "manifest":"k8s/backend/k8s-rent/deployment.yaml",
                "image":"backend-rent"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-search }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-search",
                "context":"backend-search",
                "dockerfile":"backend-search/Dockerfile",
                "manifest":"k8s/backend/k8s-search/deployment.yaml",
                "image":"backend-search"
              }]' <<< "$SERVICES")
          fi

          echo "Changed services:"
          echo "$SERVICES" | jq .

          echo "matrix={\"include\":$(echo "$SERVICES")}" >> "$GITHUB_OUTPUT"

          if [[ "$SERVICES" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================
  # BUILD ONLY CHANGED SERVICES
  # ==========================================================
  build-and-push:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          # The frontend is the ONLY image that needs build-args: Vite bakes
          # VITE_* vars into the compiled JS at build time, so they must be
          # set here, not in a k8s configmap/secret (those only affect
          # runtime env, which the browser bundle never reads).
          #
          # IMPORTANT: replace https://zero-broker.duckdns.org below with
          # your actual production domain (must match k8s/ingress/ingress.yaml
          # `host:` and the TLS cert). The path suffix (/api/home etc.) must
          # match the `path:` prefixes in that same ingress file — the
          # Traefik ingress routes each prefix to the matching backend
          # service, so these URLs just need to land on the right domain;
          # ingress handles getting them to the right pod from there.
          # Using the FULL origin (not empty strings) also keeps this
          # compatible with the existing frontend guard that rejects an
          # empty base URL — no frontend code changes required.
          build-args: |
            ${{ matrix.name == 'frontend' && 'VITE_HOME_BASE_URL=https://zero-broker.duckdns.org' || '' }}
            ${{ matrix.name == 'frontend' && 'VITE_RENT_BASE_URL=https://zero-broker.duckdns.org' || '' }}
            ${{ matrix.name == 'frontend' && 'VITE_BUY_BASE_URL=https://zero-broker.duckdns.org' || '' }}
            ${{ matrix.name == 'frontend' && 'VITE_SEARCH_BASE_URL=https://zero-broker.duckdns.org' || '' }}
            ${{ matrix.name == 'frontend' && 'VITE_AUTH_BASE_URL=https://zero-broker.duckdns.org' || '' }}
          cache-from: |
            type=gha,scope=${{ matrix.name }}
          cache-to: |
            type=gha,scope=${{ matrix.name }},mode=max

      # Fails fast if the digest is missing instead of silently shipping a
      # broken/half-pushed multi-arch manifest to the GitOps update step.
      - name: Verify image digest
        run: |
          set -euo pipefail
          if [[ -z "${{ steps.build.outputs.digest }}" ]]; then
            echo "::error::No digest returned for ${{ matrix.image }} — build/push likely failed silently."
            exit 1
          fi
          echo "Pushed ${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  # ==========================================================
  # UPDATE ONLY CHANGED KUBERNETES MANIFESTS (VIA PR)
  # ==========================================================
  update-gitops:
    name: Update GitOps Manifests
    needs:
      - changes
      - build-and-push
    if: needs.changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update changed image tags
        id: update
        shell: bash
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"

          echo "$MATRIX" | jq -c '.include[]' | while read -r service; do
            IMAGE=$(echo "$service" | jq -r '.image')
            MANIFEST=$(echo "$service" | jq -r '.manifest')

            if [[ ! -f "$MANIFEST" ]]; then
              echo "::error::Manifest not found: $MANIFEST"
              exit 1
            fi

            echo "Updating:"
            echo "  Image:    $IMAGE"
            echo "  Manifest: $MANIFEST"
            echo "  Tag:      $TAG"

            sed -i \
              "s|image: $DOCKER_USERNAME/${IMAGE}:.*|image: $DOCKER_USERNAME/${IMAGE}:${TAG}|" \
              "$MANIFEST"
          done

      # Catches a bad sed substitution (e.g. broken indentation/quoting)
      # before it's committed and merged into the manifests ArgoCD reads from.
      - name: Validate manifest YAML
        run: |
          set -euo pipefail
          pip install --quiet --break-system-packages yamllint 2>/dev/null || pip install --quiet yamllint
          for f in $(git diff --name-only -- k8s/); do
            echo "Validating $f"
            python3 -c "import yaml,sys; list(yaml.safe_load_all(open('$f')))"
          done

      - name: Show changed manifests
        run: |
          echo "=========================================="
          echo "Updated Kubernetes manifests"
          echo "=========================================="
          git diff -- k8s/

      - name: Commit and open GitOps PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes changes detected."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Unique per-run branch name avoids collisions between concurrent
          # runs and makes each PR traceable back to its triggering commit/run.
          BRANCH="gitops/update-${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore(gitops): update images to ${GITHUB_SHA}"
          git push origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated image tag update for commit ${GITHUB_SHA}.

          **Triggered by:** ${GITHUB_ACTOR}
          **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          **Services updated:**
          \`\`\`
          $(echo "$MATRIX" | jq -r '.include[].image' 2>/dev/null || true)
          \`\`\`
          EOF
          )

          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(gitops): update images to ${GITHUB_SHA:0:8}" \
            --body "$BODY" \
            --label "gitops,automated")

          echo "Opened PR: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "opened=true" >> "$GITHUB_OUTPUT"

          # Queues the merge — only completes once required checks/reviews
          # pass, so this never bypasses branch protection.
          gh pr merge --auto --squash --delete-branch "$PR_URL"

      # If the ruleset requires manual approval, don't hang the runner
      # indefinitely — poll for a bounded time, then exit cleanly and let
      # the PR merge whenever a human approves it.
      - name: Wait for auto-merge (bounded)
        if: steps.pr.outputs.opened == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          for i in $(seq 1 20); do
            STATE=$(gh pr view "$PR_URL" --json state -q .state)
            if [[ "$STATE" == "MERGED" ]]; then
              echo "PR merged."
              exit 0
            fi
            if [[ "$STATE" == "CLOSED" ]]; then
              echo "::error::PR was closed without merging."
              exit 1
            fi
            sleep 15
          done
          echo "::warning::PR not merged within 5 minutes — likely awaiting review/checks. It will merge automatically once approved: $PR_URL"
