name: Build, Push and GitOps Update

on:
  push:
    branches:
      - CI-CD
    paths:
      - "front-end/**"
      - "backend/**"
      - "backend-auth/**"
      - "backend-buy/**"
      - "backend-home/**"
      - "backend-rent/**"
      - "backend-search/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ==========================================================
  # DETECT WHICH SERVICES CHANGED
  # ==========================================================
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'front-end/**'

            backend:
              - 'backend/**'

            backend-auth:
              - 'backend-auth/**'

            backend-buy:
              - 'backend-buy/**'

            backend-home:
              - 'backend-home/**'

            backend-rent:
              - 'backend-rent/**'

            backend-search:
              - 'backend-search/**'

      - name: Create build matrix
        id: matrix
        shell: bash
        run: |
          SERVICES="[]"

          if [[ "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"frontend",
                "context":"front-end",
                "dockerfile":"front-end/Dockerfile",
                "manifest":"k8s/frontend/deployment.yaml",
                "image":"frontend"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend",
                "context":"backend",
                "dockerfile":"backend/Dockerfile",
                "manifest":"k8s/backend/deployment.yaml",
                "image":"backend"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-auth }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-auth",
                "context":"backend-auth",
                "dockerfile":"backend-auth/Dockerfile",
                "manifest":"k8s/backend/k8s-auth/deployment.yaml",
                "image":"backend-auth"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-buy }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-buy",
                "context":"backend-buy",
                "dockerfile":"backend-buy/Dockerfile",
                "manifest":"k8s/backend/k8s-buy/deployment.yaml",
                "image":"backend-buy"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-home }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-home",
                "context":"backend-home",
                "dockerfile":"backend-home/Dockerfile",
                "manifest":"k8s/backend/k8s-home/deployment.yaml",
                "image":"backend-home"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-rent }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-rent",
                "context":"backend-rent",
                "dockerfile":"backend-rent/Dockerfile",
                "manifest":"k8s/backend/k8s-rent/deployment.yaml",
                "image":"backend-rent"
              }]' <<< "$SERVICES")
          fi

          if [[ "${{ steps.changes.outputs.backend-search }}" == "true" ]]; then
            SERVICES=$(jq -c \
              '. + [{
                "name":"backend-search",
                "context":"backend-search",
                "dockerfile":"backend-search/Dockerfile",
                "manifest":"k8s/backend/k8s-search/deployment.yaml",
                "image":"backend-search"
              }]' <<< "$SERVICES")
          fi

          echo "Changed services:"
          echo "$SERVICES" | jq .

          echo "matrix={\"include\":$(echo "$SERVICES")}" >> "$GITHUB_OUTPUT"

          if [[ "$SERVICES" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi


  # ==========================================================
  # BUILD ONLY CHANGED SERVICES
  # ==========================================================
  build-and-push:
    name: Build ${{ matrix.name }}
    needs: changes

    if: needs.changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          cache-from: |
            type=gha,scope=${{ matrix.name }}

          cache-to: |
            type=gha,scope=${{ matrix.name }},mode=max


  # ==========================================================
  # UPDATE ONLY CHANGED KUBERNETES MANIFESTS
  # ==========================================================
  update-gitops:
    name: Update GitOps Manifests
    needs:
      - changes
      - build-and-push

    if: needs.changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update changed image tags
        shell: bash
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          TAG="${GITHUB_SHA}"

          echo "$MATRIX" | jq -c '.include[]' | while read -r service; do

            IMAGE=$(echo "$service" | jq -r '.image')
            MANIFEST=$(echo "$service" | jq -r '.manifest')

            echo "Updating:"
            echo "  Image:    $IMAGE"
            echo "  Manifest: $MANIFEST"
            echo "  Tag:      $TAG"

            sed -i \
              "s|image: $DOCKER_USERNAME/${IMAGE}:.*|image: $DOCKER_USERNAME/${IMAGE}:${TAG}|" \
              "$MANIFEST"

          done

      - name: Show changed manifests
        run: |
          echo "=========================================="
          echo "Updated Kubernetes manifests"
          echo "=========================================="

          git diff -- k8s/

      - name: Commit GitOps changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes changes detected."
            exit 0
          fi

          git commit \
            -m "chore(gitops): update images to ${GITHUB_SHA}"

          git push