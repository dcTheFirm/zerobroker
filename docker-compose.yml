name: zerobroker

# NOTE: MongoDB Atlas is a managed cloud database, so there is intentionally
# no "mongo" container here. Every backend connects out to Atlas using
# MONGODB_URI, which must be set in a root .env file (see .env.example).

x-backend-env: &backend-env
  MONGODB_URI: ${MONGODB_URI}
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-zero_broker}
  HOST: 0.0.0.0

services:
  backend:
    build:
      context: ./backend
    container_name: zerobroker-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 4000
    ports:
      - "4000:4000"
    networks:
      - zerobroker-net

  backend-home:
    build:
      context: ./backend-home
    container_name: zerobroker-backend-home
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 4001
    ports:
      - "4001:4001"
    networks:
      - zerobroker-net

  backend-rent:
    build:
      context: ./backend-rent
    container_name: zerobroker-backend-rent
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 4002
    ports:
      - "4002:4002"
    networks:
      - zerobroker-net

  backend-buy:
    build:
      context: ./backend-buy
    container_name: zerobroker-backend-buy
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 4003
    ports:
      - "4003:4003"
    networks:
      - zerobroker-net

  backend-search:
    build:
      context: ./backend-search
    container_name: zerobroker-backend-search
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 4004
    ports:
      - "4004:4004"
    networks:
      - zerobroker-net

  backend-auth:
    build:
      context: ./backend-auth
    container_name: zerobroker-backend-auth
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - zerobroker-net

  front-end:
    build:
      context: ./front-end
      args:
        # Browser-facing URLs — these get baked into the JS bundle at build time.
        # Change these (and rebuild) if you deploy anywhere other than localhost.
        VITE_HOME_BASE_URL: ${VITE_HOME_BASE_URL:-http://localhost:4001}
        VITE_RENT_BASE_URL: ${VITE_RENT_BASE_URL:-http://localhost:4002}
        VITE_BUY_BASE_URL: ${VITE_BUY_BASE_URL:-http://localhost:4003}
        VITE_SEARCH_BASE_URL: ${VITE_SEARCH_BASE_URL:-http://localhost:4004}
        VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-http://localhost:5000}
    container_name: zerobroker-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - backend-home
      - backend-rent
      - backend-buy
      - backend-search
      - backend-auth
    ports:
      - "5173:80"
    networks:
      - zerobroker-net

networks:
  zerobroker-net:
    driver: bridge
