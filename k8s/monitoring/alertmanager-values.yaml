alertmanager:
  config:
    global:
      resolve_timeout: 5m

    route:
      group_by:
        - alertname
        - application
        - service

      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h

      receiver: discord-warning

      routes:
        - matchers:
            - severity="critical"
          receiver: discord-critical

        - matchers:
            - severity="warning"
          receiver: discord-warning

    receivers:

      # =========================
      # WARNING DISCORD CHANNEL
      # =========================
      - name: discord-warning
        discord_configs:
          - webhook_url: "Warning Channel Discord Webhook URL"
            send_resolved: true
            title: "⚠️ Zero Broker Warning"
            message: |
              **⚠️ WARNING ALERT**
              **🤒 HOSH ME AAO ABHIJEET**

              **Alert:** {{ .CommonAnnotations.summary }}
              **Service:** {{ .CommonLabels.service }}
              **Severity:** {{ .CommonLabels.severity }}

              {{ .CommonAnnotations.description }}


      # =========================
      # CRITICAL DISCORD CHANNEL
      # =========================
      - name: discord-critical
        discord_configs:
          - webhook_url: "Critical Channel Discord Webhook URL"
            send_resolved: true
            title: "🚨 Zero Broker Critical"
            message: |
              **🚨 CRITICAL ALERT**
              **🤬 KYA CHEDA BHOSDI**

              **Alert:** {{ .CommonAnnotations.summary }}
              **Service:** {{ .CommonLabels.service }}
              **Severity:** {{ .CommonLabels.severity }}

              {{ .CommonAnnotations.description }}