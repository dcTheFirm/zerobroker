apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerobroker-frontend-deployment
  namespace: zero-broker
  labels:
    app: zerobroker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zerobroker-frontend
  template:
    metadata:
      labels:
        app: zerobroker-frontend
    spec:
      containers:
      - name: zerobroker-frontend
        image: dcthefirm/frontend:2c9c27bbb7cff5fa58d3db464351b92bd7d6c3dc
        ports:
        - containerPort: 80
