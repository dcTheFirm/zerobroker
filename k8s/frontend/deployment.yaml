apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerobroker-frontend-deployment
  namespace: zero-broker
  labels:
    app: zerobroker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zerobroker-frontend
  template:
    metadata:
      labels:
        app: zerobroker-frontend
    spec:
      containers:
      - name: zerobroker-frontend
        image: dcthefirm/frontend:47a4cd9329298d9603e2856b1887ce30e8442e22
        ports:
        - containerPort: 80
