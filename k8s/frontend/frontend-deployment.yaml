apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-broker-frontend-deployment
  labels:
    app: zero-broker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zero-broker
  template:
    metadata:
      labels:
        app: zero-broker
    spec:
      containers:
      - name: zero-broker
        image: dcthefirm/frontend:4e1e9c3e03e27e2a95724f13f8cb24a231108c5a
        ports:
        - containerPort: 80
