apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-home
  namespace: zero-broker
  labels:
    app: backend-home

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend-home

  template:
    metadata:
      labels:
        app: backend-home

    spec:
      containers:
        - name: backend-home
          image: dcthefirm/backend-home:f6e2c5e5f8d6115115698e22d85f1514fcdbf7ba
          ports:
            - containerPort: 4001

          envFrom:
            # - configMapRef:
            #     name: auth-configmap
            - secretRef:
                name: mongo-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 20