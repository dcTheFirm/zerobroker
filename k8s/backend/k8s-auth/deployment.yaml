apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-auth
  namespace: zero-broker
  labels:
    app: backend-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-auth
  template:
    metadata:
      labels:
        app: backend-auth
    spec:
      containers:
        - name: backend-auth
          image: dcthefirm/backend-auth:2c9c27bbb7cff5fa58d3db464351b92bd7d6c3dc
          ports:
            - containerPort: 5000
          envFrom:
           # - configMapRef:
              #  name: auth-configmap
            - secretRef:
                name: mongo-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20