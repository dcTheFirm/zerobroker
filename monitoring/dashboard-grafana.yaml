    panel-12:
      kind: Panel
      spec:
        id: 12
        title: CPU Throttling
        description: >-
          % of CPU periods throttled per pod — non-zero means the pod is hitting
          its CPU limit and getting slowed down.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: prometheus
                    version: v0
                    datasource:
                      name: prometheus
                    spec:
                      editorMode: code
                      expr: >-
                        100 * sum by (pod)
                        (rate(container_cpu_cfs_throttled_periods_total{namespace="zero-broker",
                        container!="", container!="POD"}[5m]))

                        /

                        sum by (pod)
