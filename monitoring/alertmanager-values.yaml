alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-discord    # mounts your Secret into the Alertmanager pod

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by:
        - alertname
        - app_namespace
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: null-receiver

      routes:
        - matchers:
            - app_namespace="zero-broker"
            - severity="critical"
          receiver: discord-critical
        - matchers:
            - app_namespace="zero-broker"
            - severity="warning"
          receiver: discord-warning

    receivers:
      - name: null-receiver

      - name: discord-warning
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/warning-webhook-url
            send_resolved: true
            title: "⚠️ Zero Broker Warning"
            message: |
              {{ range .Alerts }}
              **Alert:** {{ .Labels.alertname }}
              **Namespace:** {{ .Labels.app_namespace }}
              **Affected:** {{ or .Labels.deployment .Labels.pod .Labels.instance }}
              **Summary:** {{ .Annotations.summary }}
              **Description:** {{ .Annotations.description }}
              ---
              {{ end }}

      - name: discord-critical
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/critical-webhook-url
            send_resolved: true
            title: "🚨 Zero Broker Critical"
            message: |
              {{ range .Alerts }}
              **Alert:** {{ .Labels.alertname }}
              **Namespace:** {{ .Labels.app_namespace }}
              **Affected:** {{ or .Labels.deployment .Labels.pod .Labels.instance }}
              **Summary:** {{ .Annotations.summary }}
              **Description:** {{ .Annotations.description }}
              ---
              {{ end }}